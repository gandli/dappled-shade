<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>树影婆娑 · 3D</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://esm.sh/three@0.180.0",
        "three/addons/": "https://esm.sh/three@0.180.0/examples/jsm/",
        "@dgreenheck/ez-tree": "https://esm.sh/@dgreenheck/ez-tree@1.1.0?deps=three@0.180.0"
      }
    }
  </script>
</head>

<body>
  <div id="app"></div>

  <main>
    <h1>树影婆娑</h1>
    <p>ez-tree 程序化树 · Three.js 风动 · 真实光影</p>
  </main>

  <details id="controls" open>
    <summary>参数</summary>
    <div class="panel">
      <div class="field">
        <span class="label">风力</span>
        <div class="segmented">
          <label><input type="radio" name="wind" value="0"><span>一级</span></label>
          <label><input type="radio" name="wind" value="1" checked><span>二级</span></label>
          <label><input type="radio" name="wind" value="2"><span>三级</span></label>
        </div>
      </div>
      <label class="field">
        <span class="label">夜晚</span>
        <input type="checkbox" id="daynight-toggle">
        <span class="track"></span>
      </label>
    </div>
  </details>

  <script type="module" src="./main.js"></script>
</body>

</html>
